# ==============================================================================
# NOVA — Render Cloud Blueprint Configuration (render.yaml)
# Deploy 24/7 do Ecossistema Multi-Agente NOVA
# ==============================================================================

services:
  - type: web
    name: nova-control-center
    runtime: docker
    plan: free
    region: oregon
    branch: main
    autoDeploy: true
    healthCheckPath: /health
    dockerfilePath: Dockerfile
    dockerContext: .
    envVars:
      - key: PORT
        value: 10000
      - key: NOVA_PORT
        value: 10000
      - key: SPRING_PROFILES_ACTIVE
        value: default
