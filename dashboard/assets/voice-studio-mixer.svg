<svg viewBox="0 0 512 512" width="512" height="512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38393E"/>
      <stop offset="40%" stop-color="#26272B"/>
      <stop offset="100%" stop-color="#1B1C1E"/>
    </linearGradient>
    
    <linearGradient id="bodyBevel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#55575E" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Knob Gradients -->
    <linearGradient id="knobRim" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4F5158"/>
      <stop offset="100%" stop-color="#18191B"/>
    </linearGradient>
    
    <radialGradient id="knobFace" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#3A3B40"/>
      <stop offset="80%" stop-color="#202124"/>
      <stop offset="100%" stop-color="#151618"/>
    </radialGradient>

    <!-- Fader Cap Gradients -->
    <linearGradient id="faderCap" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#686A73"/>
      <stop offset="15%" stop-color="#43454B"/>
      <stop offset="50%" stop-color="#2D2E33"/>
      <stop offset="85%" stop-color="#484A52"/>
      <stop offset="100%" stop-color="#1E1F22"/>
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="iconShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.55"/>
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.35"/>
    </filter>

    <filter id="recessShadow" x="-20%" y="-10%" width="140%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.8" flood-in="SourceAlpha"/>
    </filter>

    <filter id="capShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Main Body Squircle -->
  <rect x="32" y="32" width="448" height="448" rx="108" fill="url(#bodyGrad)" stroke="url(#bodyBevel)" stroke-width="2.5" filter="url(#iconShadow)"/>

  <!-- ================= TOP: 3 ROTARY KNOBS ================= -->
  
  <!-- KNOB 1 (LEFT) -->
  <g transform="translate(130, 140)">
    <!-- Radial Dots Ring -->
    <!-- Active gold arc dots -->
    <circle cx="-32" cy="18" r="2.8" fill="#E8B038"/>
    <circle cx="-37" cy="0" r="2.8" fill="#E8B038"/>
    <circle cx="-32" cy="-18" r="2.8" fill="#E8B038"/>
    <circle cx="-20" cy="-32" r="2.8" fill="#E8B038"/>
    <circle cx="0" cy="-37" r="2.8" fill="#E8B038"/>
    <!-- Inactive muted dots -->
    <circle cx="20" cy="-32" r="2.4" fill="#666870" opacity="0.6"/>
    <circle cx="32" cy="-18" r="2.4" fill="#666870" opacity="0.6"/>
    <circle cx="37" cy="0" r="2.4" fill="#666870" opacity="0.6"/>
    <circle cx="32" cy="18" r="2.4" fill="#666870" opacity="0.6"/>
    
    <!-- Knob Outer Rim -->
    <circle cx="0" cy="0" r="29" fill="url(#knobRim)" filter="url(#capShadow)"/>
    <!-- Knob Face -->
    <circle cx="0" cy="0" r="24" fill="url(#knobFace)" stroke="#111214" stroke-width="1.5"/>
    <!-- Knob Indicator Dot -->
    <circle cx="-6" cy="-15" r="2.5" fill="#E8B038"/>
  </g>

  <!-- KNOB 2 (CENTER) -->
  <g transform="translate(256, 140)">
    <!-- Radial Dots Ring -->
    <circle cx="-32" cy="18" r="2.8" fill="#E8B038"/>
    <circle cx="-37" cy="0" r="2.8" fill="#E8B038"/>
    <circle cx="-32" cy="-18" r="2.8" fill="#E8B038"/>
    <circle cx="-20" cy="-32" r="2.8" fill="#E8B038"/>
    <circle cx="0" cy="-37" r="2.8" fill="#E8B038"/>
    <circle cx="20" cy="-32" r="2.8" fill="#E8B038"/>
    <circle cx="32" cy="-18" r="2.4" fill="#666870" opacity="0.6"/>
    <circle cx="37" cy="0" r="2.4" fill="#666870" opacity="0.6"/>
    <circle cx="32" cy="18" r="2.4" fill="#666870" opacity="0.6"/>
    
    <circle cx="0" cy="0" r="29" fill="url(#knobRim)" filter="url(#capShadow)"/>
    <circle cx="0" cy="0" r="24" fill="url(#knobFace)" stroke="#111214" stroke-width="1.5"/>
    <circle cx="0" cy="-16" r="2.5" fill="#E8B038"/>
  </g>

  <!-- KNOB 3 (RIGHT) -->
  <g transform="translate(382, 140)">
    <!-- Radial Dots Ring -->
    <circle cx="-32" cy="18" r="2.8" fill="#E8B038"/>
    <circle cx="-37" cy="0" r="2.8" fill="#E8B038"/>
    <circle cx="-32" cy="-18" r="2.8" fill="#E8B038"/>
    <circle cx="-20" cy="-32" r="2.4" fill="#666870" opacity="0.6"/>
    <circle cx="0" cy="-37" r="2.4" fill="#666870" opacity="0.6"/>
    <circle cx="20" cy="-32" r="2.4" fill="#666870" opacity="0.6"/>
    <circle cx="32" cy="-18" r="2.4" fill="#666870" opacity="0.6"/>
    <circle cx="37" cy="0" r="2.4" fill="#666870" opacity="0.6"/>
    <circle cx="32" cy="18" r="2.4" fill="#666870" opacity="0.6"/>
    
    <circle cx="0" cy="0" r="29" fill="url(#knobRim)" filter="url(#capShadow)"/>
    <circle cx="0" cy="0" r="24" fill="url(#knobFace)" stroke="#111214" stroke-width="1.5"/>
    <circle cx="-13" cy="-10" r="2.5" fill="#E8B038"/>
  </g>


  <!-- ================= BOTTOM: 3 VERTICAL FADERS ================= -->

  <!-- CHANNEL 1 (LEFT) -->
  <g transform="translate(130, 320)">
    <!-- Recessed Slot Well -->
    <rect x="-24" y="-95" width="48" height="190" rx="14" fill="#18191C" stroke="#121315" stroke-width="2"/>
    <rect x="-22" y="-93" width="44" height="186" rx="12" fill="#131416"/>
    
    <!-- Scale Tick Marks (Left & Right) -->
    <g stroke="#555760" stroke-width="1.8" stroke-linecap="round" opacity="0.75">
      <!-- Left ticks -->
      <line x1="-16" y1="-80" x2="-10" y2="-80"/>
      <line x1="-16" y1="-60" x2="-10" y2="-60"/>
      <line x1="-16" y1="-40" x2="-10" y2="-40"/>
      <line x1="-16" y1="-20" x2="-10" y2="-20"/>
      <line x1="-16" y1="0" x2="-10" y2="0"/>
      <line x1="-16" y1="20" x2="-10" y2="20"/>
      <line x1="-16" y1="40" x2="-10" y2="40"/>
      <line x1="-16" y1="60" x2="-10" y2="60"/>
      <line x1="-16" y1="80" x2="-10" y2="80"/>
      <!-- Right ticks -->
      <line x1="10" y1="-80" x2="16" y2="-80"/>
      <line x1="10" y1="-60" x2="16" y2="-60"/>
      <line x1="10" y1="-40" x2="16" y2="-40"/>
      <line x1="10" y1="-20" x2="16" y2="-20"/>
      <line x1="10" y1="0" x2="16" y2="0"/>
      <line x1="10" y1="20" x2="16" y2="20"/>
      <line x1="10" y1="40" x2="16" y2="40"/>
      <line x1="10" y1="60" x2="16" y2="60"/>
      <line x1="10" y1="80" x2="16" y2="80"/>
    </g>

    <!-- Center Groove -->
    <line x1="0" y1="-85" x2="0" y2="85" stroke="#08090A" stroke-width="4.5" stroke-linecap="round"/>
    
    <!-- Active Yellow Level Line (from bottom 80 up to cap position 15) -->
    <line x1="0" y1="80" x2="0" y2="15" stroke="#E8B038" stroke-width="3" stroke-linecap="round"/>

    <!-- Fader Cap 1 (Position: y = 15) -->
    <g transform="translate(0, 15)" filter="url(#capShadow)">
      <rect x="-19" y="-14" width="38" height="28" rx="4" fill="url(#faderCap)" stroke="#111214" stroke-width="1.2"/>
      <!-- Cap Center Highlight -->
      <rect x="-19" y="-2" width="38" height="4" fill="#888A94" opacity="0.85"/>
      <line x1="-17" y1="0" x2="17" y2="0" stroke="#FFFFFF" stroke-width="1" opacity="0.6"/>
      <line x1="-19" y1="-13" x2="19" y2="-13" stroke="#90939E" stroke-width="1" opacity="0.5"/>
    </g>
  </g>

  <!-- CHANNEL 2 (CENTER) -->
  <g transform="translate(256, 320)">
    <rect x="-24" y="-95" width="48" height="190" rx="14" fill="#18191C" stroke="#121315" stroke-width="2"/>
    <rect x="-22" y="-93" width="44" height="186" rx="12" fill="#131416"/>
    
    <g stroke="#555760" stroke-width="1.8" stroke-linecap="round" opacity="0.75">
      <line x1="-16" y1="-80" x2="-10" y2="-80"/>
      <line x1="-16" y1="-60" x2="-10" y2="-60"/>
      <line x1="-16" y1="-40" x2="-10" y2="-40"/>
      <line x1="-16" y1="-20" x2="-10" y2="-20"/>
      <line x1="-16" y1="0" x2="-10" y2="0"/>
      <line x1="-16" y1="20" x2="-10" y2="20"/>
      <line x1="-16" y1="40" x2="-10" y2="40"/>
      <line x1="-16" y1="60" x2="-10" y2="60"/>
      <line x1="-16" y1="80" x2="-10" y2="80"/>
      <line x1="10" y1="-80" x2="16" y2="-80"/>
      <line x1="10" y1="-60" x2="16" y2="-60"/>
      <line x1="10" y1="-40" x2="16" y2="-40"/>
      <line x1="10" y1="-20" x2="16" y2="-20"/>
      <line x1="10" y1="0" x2="16" y2="0"/>
      <line x1="10" y1="20" x2="16" y2="20"/>
      <line x1="10" y1="40" x2="16" y2="40"/>
      <line x1="10" y1="60" x2="16" y2="60"/>
      <line x1="10" y1="80" x2="16" y2="80"/>
    </g>

    <line x1="0" y1="-85" x2="0" y2="85" stroke="#08090A" stroke-width="4.5" stroke-linecap="round"/>
    
    <!-- Active Yellow Level Line (from bottom 80 up to cap position -35) -->
    <line x1="0" y1="80" x2="0" y2="-35" stroke="#E8B038" stroke-width="3" stroke-linecap="round"/>

    <!-- Fader Cap 2 (Position: y = -35 / High) -->
    <g transform="translate(0, -35)" filter="url(#capShadow)">
      <rect x="-19" y="-14" width="38" height="28" rx="4" fill="url(#faderCap)" stroke="#111214" stroke-width="1.2"/>
      <rect x="-19" y="-2" width="38" height="4" fill="#888A94" opacity="0.85"/>
      <line x1="-17" y1="0" x2="17" y2="0" stroke="#FFFFFF" stroke-width="1" opacity="0.6"/>
      <line x1="-19" y1="-13" x2="19" y2="-13" stroke="#90939E" stroke-width="1" opacity="0.5"/>
    </g>
  </g>

  <!-- CHANNEL 3 (RIGHT) -->
  <g transform="translate(382, 320)">
    <rect x="-24" y="-95" width="48" height="190" rx="14" fill="#18191C" stroke="#121315" stroke-width="2"/>
    <rect x="-22" y="-93" width="44" height="186" rx="12" fill="#131416"/>
    
    <g stroke="#555760" stroke-width="1.8" stroke-linecap="round" opacity="0.75">
      <line x1="-16" y1="-80" x2="-10" y2="-80"/>
      <line x1="-16" y1="-60" x2="-10" y2="-60"/>
      <line x1="-16" y1="-40" x2="-10" y2="-40"/>
      <line x1="-16" y1="-20" x2="-10" y2="-20"/>
      <line x1="-16" y1="0" x2="-10" y2="0"/>
      <line x1="-16" y1="20" x2="-10" y2="20"/>
      <line x1="-16" y1="40" x2="-10" y2="40"/>
      <line x1="-16" y1="60" x2="-10" y2="60"/>
      <line x1="-16" y1="80" x2="-10" y2="80"/>
      <line x1="10" y1="-80" x2="16" y2="-80"/>
      <line x1="10" y1="-60" x2="16" y2="-60"/>
      <line x1="10" y1="-40" x2="16" y2="-40"/>
      <line x1="10" y1="-20" x2="16" y2="-20"/>
      <line x1="10" y1="0" x2="16" y2="0"/>
      <line x1="10" y1="20" x2="16" y2="20"/>
      <line x1="10" y1="40" x2="16" y2="40"/>
      <line x1="10" y1="60" x2="16" y2="60"/>
      <line x1="10" y1="80" x2="16" y2="80"/>
    </g>

    <line x1="0" y1="-85" x2="0" y2="85" stroke="#08090A" stroke-width="4.5" stroke-linecap="round"/>
    
    <!-- Active Yellow Level Line (from bottom 80 up to cap position 35) -->
    <line x1="0" y1="80" x2="0" y2="35" stroke="#E8B038" stroke-width="3" stroke-linecap="round"/>

    <!-- Fader Cap 3 (Position: y = 35 / Low) -->
    <g transform="translate(0, 35)" filter="url(#capShadow)">
      <rect x="-19" y="-14" width="38" height="28" rx="4" fill="url(#faderCap)" stroke="#111214" stroke-width="1.2"/>
      <rect x="-19" y="-2" width="38" height="4" fill="#888A94" opacity="0.85"/>
      <line x1="-17" y1="0" x2="17" y2="0" stroke="#FFFFFF" stroke-width="1" opacity="0.6"/>
      <line x1="-19" y1="-13" x2="19" y2="-13" stroke="#90939E" stroke-width="1" opacity="0.5"/>
    </g>
  </g>
</svg>
